<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision App V4</title>

<style>
body {
  font-family: system-ui;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  margin: 0;
  padding: 20px;
}

h1 { margin-bottom: 10px; }

/* NAV */
.nav {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

.nav button {
  background: none;
  border: none;
  color: #3b82f6;
  cursor: pointer;
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: #1e293b;
  border-radius: 16px;
  padding: 15px;
}

/* TEXT AREA */
.overlay { position: relative; }

textarea {
  width: 100%;
  height: 200px;
  background: transparent;
  color: white;
  border: none;
  padding: 10px;
  z-index: 2;
  position: relative;
}

textarea:focus { outline: none; }

.correction {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0.2;
  padding: 10px;
  white-space: pre-wrap;
  pointer-events: none;
}

/* BUTTONS */
button.main {
  margin-top: 10px;
  padding: 10px;
  background: #3b82f6;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

/* MOBILE */
@media (max-width: 800px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<h1>📚 Revision App V4</h1>

<select id="textSelector" onchange="changeText()"></select>

<div class="nav">
  <button onclick="prevStep()">⬅</button>
  <strong id="stepTitle"></strong>
  <button onclick="nextStep()">➡</button>
</div>

<div class="container">

  <!-- LEFT -->
  <div class="card overlay">
    <div class="correction" id="correction"></div>

    <textarea id="input"></textarea>

    <button class="main" onclick="toggleEdit()">✏️ Edit / Lock</button>
    <button class="main" onclick="save()">💾 Save</button>
    <button class="main" onclick="clearStep()">🗑 Reset étape</button>
    <button class="main" onclick="clearAll()">🔥 Reset tout</button>
  </div>

  <!-- RIGHT -->
  <div class="card">
    <h3>Progression</h3>
    <p id="progress">0%</p>

    <button class="main" onclick="finish()">✅ Correction complète</button>
    <pre id="final"></pre>
  </div>

</div>

<script>

/* ===== DATA ===== */

const texts = {
  "Dormeur du Val": {
    intro: "INTRO CORRECTE : Rimbaud dénonce la guerre à travers une nature trompeuse...",
    problematique: "PROBLÉMATIQUE : Comment Rimbaud transforme-t-il une scène paisible en dénonciation de la guerre ?",
    mouvements: "MOUVEMENTS : 1) Nature idyllique 2) Soldat ambigu 3) Chute brutale",
    conclusion: "CONCLUSION : Le poème révèle la violence de la guerre sous une apparence paisible."
  },

  "Les Tahitiens": {
    intro: "INTRO CORRECTE : Bougainville décrit les Tahitiens dans un regard des Lumières...",
    problematique: "PROBLÉMATIQUE : Comment la description des Tahitiens critique-t-elle l’Europe ?",
    mouvements: "MOUVEMENTS : 1) Beauté naturelle 2) Comparaison avec l’Europe 3) Société utopique",
    conclusion: "CONCLUSION : Le texte construit un éloge du naturel et critique l’artifice européen."
  }
};

const steps = ["intro", "problematique", "mouvements", "conclusion"];

let currentStep = 0;
let currentText = "Dormeur du Val";
let locked = false;

/* ===== INIT ===== */

function init() {
  const selector = document.getElementById("textSelector");

  Object.keys(texts).forEach(t => {
    let opt = document.createElement("option");
    opt.value = t;
    opt.innerText = t;
    selector.appendChild(opt);
  });

  updateUI();
}

window.onload = init;

/* ===== UI ===== */

function updateUI() {
  document.getElementById("stepTitle").innerText = steps[currentStep];

  document.getElementById("correction").innerText =
    texts[currentText][steps[currentStep]];

  load();
  updateProgress();
}

/* ===== NAV ===== */

function nextStep() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    updateUI();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    updateUI();
  }
}

/* ===== TEXT ===== */

function changeText() {
  currentText = textSelector.value;
  currentStep = 0;
  updateUI();
}

/* ===== SAVE ===== */

function save() {
  localStorage.setItem(currentText + "_" + steps[currentStep], input.value);
}

function load() {
  input.value =
    localStorage.getItem(currentText + "_" + steps[currentStep]) || "";
}

/* ===== RESET ===== */

function clearStep() {
  localStorage.removeItem(currentText + "_" + steps[currentStep]);
  input.value = "";
}

function clearAll() {
  steps.forEach(s => {
    localStorage.removeItem(currentText + "_" + s);
  });
  input.value = "";
  updateProgress();
}

/* ===== LOCK ===== */

function toggleEdit() {
  locked = !locked;
  input.disabled = locked;
}

/* ===== PROGRESS ===== */

function updateProgress() {
  let done = 0;

  steps.forEach(s => {
    if (localStorage.getItem(currentText + "_" + s)) done++;
  });

  progress.innerText =
    Math.round((done / steps.length) * 100) + "%";
}

/* ===== FINAL ===== */

function finish() {
  let full = "";

  steps.forEach(s => {
    full += texts[currentText][s] + "\n\n";
  });

  final.innerText = full;
}

/* ===== INIT CALL ===== */

updateUI();

</script>

</body>
</html>
