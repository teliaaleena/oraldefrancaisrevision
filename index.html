<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision App V5</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body {
  font-family: Inter, system-ui;
  margin: 0;
  padding: 20px;
  background: linear-gradient(180deg, #f7f9ff 0%, #eef3ff 100%);
  color: #0f172a;
}

h1 {
  font-size: 22px;
  margin-bottom: 10px;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

select {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid #dbe3ff;
  background: white;
  font-weight: 600;
  color: #1e293b;
}

/* NAV */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  background: white;
  padding: 10px 14px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

.nav button {
  background: #eef2ff;
  border: none;
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.2s;
}

.nav button:hover {
  background: #dbeafe;
}

#stepTitle {
  font-weight: 700;
  color: #1e3a8a;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.06);
}

/* TEXTAREA */
.overlay {
  position: relative;
}

textarea {
  width: 100%;
  height: 220px;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  padding: 12px;
  font-size: 14px;
  resize: none;
  outline: none;
}

textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

.correction {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0.18;
  padding: 12px;
  white-space: pre-wrap;
  pointer-events: none;
  font-size: 14px;
}

/* BUTTONS */
button.main {
  margin-top: 10px;
  padding: 10px 14px;
  background: #3b82f6;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 999px;
  font-weight: 600;
  margin-right: 6px;
  transition: 0.2s;
}

button.main:hover {
  background: #2563eb;
  transform: translateY(-1px);
}

/* RIGHT PANEL */
#progress {
  font-size: 28px;
  font-weight: 800;
  color: #2563eb;
}

#final {
  background: #f8fafc;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  white-space: pre-wrap;
}

/* MOBILE */
@media (max-width: 800px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="topbar">
  <h1>📚 Revision App V5</h1>
  <select id="textSelector" onchange="changeText()"></select>
</div>

<div class="nav">
  <button onclick="prevStep()">⬅</button>
  <div id="stepTitle"></div>
  <button onclick="nextStep()">➡</button>
</div>

<div class="container">

  <!-- LEFT -->
  <div class="card overlay">
    <div class="correction" id="correction"></div>

    <textarea id="input"></textarea>

    <button class="main" onclick="toggleEdit()">✏️ Edit / Lock</button>
    <button class="main" onclick="save()">💾 Save</button>
    <button class="main" onclick="clearStep()">🗑 Reset étape</button>
    <button class="main" onclick="clearAll()">🔥 Reset tout</button>
  </div>

  <!-- RIGHT -->
  <div class="card">
    <h3>Progression</h3>
    <p id="progress">0%</p>

    <button class="main" onclick="finish()">✅ Correction complète</button>
    <pre id="final"></pre>
  </div>

</div>

<script>

const texts = {
  "Dormeur du Val": {
    intro: "INTRO CORRECTE : Rimbaud dénonce la guerre à travers une nature trompeuse...",
    problematique: "PROBLÉMATIQUE : Comment Rimbaud transforme-t-il une scène paisible en dénonciation de la guerre ?",
    mouvements: "MOUVEMENTS : 1) Nature idyllique 2) Soldat ambigu 3) Chute brutale",
    conclusion: "CONCLUSION : Le poème révèle la violence de la guerre sous une apparence paisible."
  },

  "Les Tahitiens": {
    intro: "INTRO CORRECTE : Bougainville décrit les Tahitiens dans un regard des Lumières...",
    problematique: "PROBLÉMATIQUE : Comment la description des Tahitiens critique-t-elle l’Europe ?",
    mouvements: "MOUVEMENTS : 1) Beauté naturelle 2) Comparaison avec l’Europe 3) Société utopique",
    conclusion: "CONCLUSION : Le texte construit un éloge du naturel et critique l’artifice européen."
  }
};

const steps = ["intro", "problematique", "mouvements", "conclusion"];

let currentStep = 0;
let currentText = "Dormeur du Val";
let locked = false;

function init() {
  const selector = document.getElementById("textSelector");

  Object.keys(texts).forEach(t => {
    let opt = document.createElement("option");
    opt.value = t;
    opt.innerText = t;
    selector.appendChild(opt);
  });

  updateUI();
}

window.onload = init;

function updateUI() {
  document.getElementById("stepTitle").innerText = steps[currentStep];
  document.getElementById("correction").innerText = texts[currentText][steps[currentStep]];
  load();
  updateProgress();
}

function nextStep() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    updateUI();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    updateUI();
  }
}

function changeText() {
  currentText = textSelector.value;
  currentStep = 0;
  updateUI();
}

function save() {
  localStorage.setItem(currentText + "_" + steps[currentStep], input.value);
}

function load() {
  input.value = localStorage.getItem(currentText + "_" + steps[currentStep]) || "";
}

function clearStep() {
  localStorage.removeItem(currentText + "_" + steps[currentStep]);
  input.value = "";
}

function clearAll() {
  steps.forEach(s => {
    localStorage.removeItem(currentText + "_" + s);
  });
  input.value = "";
  updateProgress();
}

function toggleEdit() {
  locked = !locked;
  input.disabled = locked;
}

function updateProgress() {
  let done = 0;

  steps.forEach(s => {
    if (localStorage.getItem(currentText + "_" + s)) done++;
  });

  progress.innerText = Math.round((done / steps.length) * 100) + "%";
}

function finish() {
  let full = "";

  steps.forEach(s => {
    full += texts[currentText][s] + "\n\n";
  });

  final.innerText = full;
}

updateUI();

</script>

</body>
</html>
