<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision App</title>

<style>
body {
  font-family: system-ui;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  margin: 0;
  padding: 20px;
}

/* TITLE */
h1 {
  font-size: 28px;
  margin-bottom: 20px;
}

/* NAV */
.nav {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.nav button {
  background: none;
  border: none;
  color: #3b82f6;
  font-size: 16px;
  cursor: pointer;
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* CARD */
.card {
  background: #1e293b;
  border-radius: 16px;
  padding: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* TEXT AREA */
.overlay {
  position: relative;
}

textarea {
  width: 100%;
  height: 300px;
  background: transparent;
  color: white;
  border: none;
  padding: 10px;
  font-size: 14px;
  z-index: 2;
  position: relative;
}

textarea:focus {
  outline: none;
}

/* CORRECTION BEHIND */
.correction {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0.2;
  padding: 10px;
  white-space: pre-wrap;
  pointer-events: none;
}

/* BUTTONS */
button.main {
  margin-top: 10px;
  padding: 10px;
  background: #3b82f6;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.2s;
}

button.main:hover {
  background: #2563eb;
}

/* ROULETTE */
#wheel {
  margin-top: 20px;
}

/* RESULT */
#result {
  font-size: 18px;
  margin-top: 10px;
  color: #38bdf8;
}

/* MOBILE */
@media (max-width: 800px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>📚 Revision App</h1>

<div class="nav">
  <button>⬅ Étape 1</button>
  <button>Étape 3 ➡</button>
</div>

<div class="container">

  <!-- LEFT -->
  <div class="card overlay">
    <div class="correction" id="correctionText"></div>

    <textarea id="userText" placeholder="Écris ton analyse ici..."></textarea>

    <button class="main" onclick="saveText()">💾 Sauvegarder</button>
    <button class="main" onclick="clearText()">🗑 Réinitialiser</button>
  </div>

  <!-- RIGHT -->
  <div class="card">
    <h3>Correction finale</h3>
    <div id="finalCorrection">Termine pour voir la correction</div>

    <button class="main" onclick="finishText()">✅ Terminer</button>
  </div>

</div>

<!-- ROULETTE -->
<div id="wheel" class="card">
  <h3>🎯 Choix aléatoire</h3>
  <button class="main" onclick="spin()">🎲 Lancer</button>
  <p id="result"></p>
</div>

<script>

/* TEXTS */
const texts = [
  "Le Dormeur du Val",
  "Les Tahitiens",
  "Misanthrope",
  "Lettres persanes"
];

/* CORRECTIONS */
const corrections = {
  "Les Tahitiens": "Correction complète des Tahitiens...",
  "Misanthrope": "Correction complète du Misanthrope...",
  "Le Dormeur du Val": "Correction complète du Dormeur du Val..."
};

/* SAVE */
function saveText() {
  localStorage.setItem("text", userText.value);
}

/* LOAD */
window.onload = () => {
  const saved = localStorage.getItem("text");
  if (saved) userText.value = saved;
};

/* RESET */
function clearText() {
  userText.value = "";
  localStorage.removeItem("text");
}

/* FINISH */
function finishText() {
  const current = result.innerText;
  finalCorrection.innerText =
    corrections[current] || "Pas de correction disponible";
}

/* ROULETTE */
function spin() {
  const random = texts[Math.floor(Math.random() * texts.length)];
  result.innerText = random;

  correctionText.innerText =
    corrections[random] || "";
}

</script>

</body>
</html>
